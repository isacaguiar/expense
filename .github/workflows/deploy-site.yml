name: Build e Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publica o site institucional (PHP) via FTP
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🚀 Deploy do site (site/public → /www/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: /www/
          local-dir: site/public/
          log-level: verbose

      - name: 🚀 Deploy dos templates (site/src → /src/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: /src/
          local-dir: site/src/
          log-level: verbose
