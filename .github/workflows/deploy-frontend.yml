name: Build e Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-deploy:
    name: Build e publica o frontend (Vite/React)
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🧰 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build de produção
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://expense-api.novemax.com.br
          # Mesma propriedade do site institucional (`site/src/config.php`).
          # Inline, não secret: um ID de propriedade GA vai no HTML de qualquer
          # forma. O carregamento depende do consentimento do usuário.
          VITE_GA_MEASUREMENT_ID: G-RNQM4DT19G
        run: npm run build

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: ftp
          port: 21
          server-dir: /www/app/
          local-dir: frontend/dist/
          log-level: verbose
