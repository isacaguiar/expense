name: Build e Deploy Laravel Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  laravel-deploy:
    name: Build Laravel app (backend)
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v3

      - name: 🧰 Configurar PHP com Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, tokenizer, xml, curl, gd
          coverage: none

      - name: 📦 Instalar dependências
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader

      - name: 🔐 Gerar arquivo .env
        working-directory: backend
        run: |
          echo "APP_NAME=SCD" > .env
          echo "APP_ENV=production" >> .env
          echo "APP_KEY=${{ secrets.ENV_APP_KEY }}" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_URL=https://expense-api.novemax.com.br" >> .env

          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ secrets.ENV_DB_HOST }}" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=${{ secrets.ENV_DB_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.ENV_DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.ENV_DB_PASSWORD }}" >> .env

          echo "MAIL_MAILER=smtp" >> .env
          echo "MAIL_HOST=${{ secrets.ENV_MAIL_HOST }}" >> .env
          echo "MAIL_PORT=587" >> .env
          echo "MAIL_USERNAME=${{ secrets.ENV_MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.ENV_MAIL_PASSWORD }}" >> .env
          echo "MAIL_ENCRYPTION=tls" >> .env
          echo "MAIL_FROM_ADDRESS=no-reply@expense-api.novemax.com.br" >> .env
          echo "MAIL_FROM_NAME=\"SCD Novemax\"" >> .env

          echo "JWT_SECRET=${{ secrets.ENV_JWT_KEY }}" >> .env
          echo "PIX_KEY=${{ secrets.ENV_PIX_KEY }}" >> .env

          echo "GOOGLE_CLIENT_ID=${{ secrets.ENV_GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.ENV_GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.ENV_GOOGLE_REDIRECT_URI }}" >> .env
          echo "FRONTEND_URL=${{ secrets.ENV_FRONTEND_URL }}" >> .env
          echo "FRONTEND_NETWORK_URL=${{ secrets.ENV_FRONTEND_NETWORK_URL }}" >> .env

          echo "WHATSAPP_ENABLED=${{ secrets.ENV_WHATSAPP_ENABLED }}" >> .env
          echo "WHATSAPP_TOKEN=${{ secrets.ENV_WHATSAPP_TOKEN }}" >> .env
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.ENV_WHATSAPP_PHONE_NUMBER_ID }}" >> .env
          echo "WHATSAPP_TEMPLATE_EXPENSE_PROOF=${{ secrets.ENV_WHATSAPP_TEMPLATE_EXPENSE_PROOF }}" >> .env
          echo "WHATSAPP_TEMPLATE_SETTLEMENT_PROOF=${{ secrets.ENV_WHATSAPP_TEMPLATE_SETTLEMENT_PROOF }}" >> .env

      - name: 🔑 Gerar chave do aplicativo
        working-directory: backend
        run: php artisan key:generate

      - name: 📦 Preparar diretório de build
        run: |
          mkdir build-laravel
          rsync -av --exclude='.git*' \
                    --exclude='tests' \
                    --exclude='storage/logs' \
                    --exclude='node_modules' \
                    --exclude='*.yml' \
                    --exclude='.env.example' \
                    backend/ build-laravel/

      - name: 🚀 Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o GSSAPIAuthentication=no"
          SOURCE: "build-laravel/"
          TARGET: ${{ secrets.SSH_TARGET }}
          ARGS: "-rltgoDzvO --delete"
          EXCLUDE: "/.git*, /tests, /storage/logs, /storage/app, /node_modules, /*.yml, /.env.example"
          SCRIPT_AFTER: |
            cd ${{ secrets.SSH_TARGET }} || exit 1
            mkdir -p storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache || true
            php artisan optimize:clear
            php artisan migrate --force --no-interaction || exit 1
            php artisan config:cache
            php artisan route:cache

