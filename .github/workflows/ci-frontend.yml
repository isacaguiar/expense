name: CI Frontend

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-test:
    name: Type-check, testes e build (frontend)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🧰 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: 🔎 Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 🧪 Testes
        working-directory: frontend
        run: npx vitest run

      - name: 🏗️ Build
        working-directory: frontend
        run: npm run build
