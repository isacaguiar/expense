<svg width="480" height="320" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <!-- chão / mesa -->
  <ellipse cx="240" cy="300" rx="190" ry="14" fill="#D9EDE0"/>
  <rect x="150" y="230" width="180" height="16" rx="8" fill="#BFE3CC"/>
  <rect x="170" y="200" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="2"/>

  <!-- notebook ao centro -->
  <rect x="205" y="176" width="70" height="46" rx="4" fill="#1B5E3A"/>
  <rect x="211" y="181" width="58" height="34" rx="2" fill="#DFF5E7"/>
  <rect x="198" y="222" width="84" height="8" rx="3" fill="#0F3D26"/>

  <!-- pessoa central -->
  <circle cx="240" cy="118" r="26" fill="#0F3D26"/>
  <path d="M198 210 C198 168 282 168 282 210 L282 226 L198 226 Z" fill="#189A5A"/>

  <!-- pessoa esquerda -->
  <circle cx="140" cy="132" r="22" fill="#14532D"/>
  <path d="M104 214 C104 176 176 176 176 214 L176 228 L104 228 Z" fill="#1FA64A"/>
  <rect x="118" y="180" width="30" height="46" rx="6" fill="#0F3D26"/>
  <rect x="122" y="186" width="22" height="30" rx="2" fill="#DFF5E7"/>

  <!-- pessoa direita -->
  <circle cx="340" cy="132" r="22" fill="#14532D"/>
  <path d="M304 214 C304 176 376 176 376 214 L376 228 L304 228 Z" fill="#189A5A"/>
  <rect x="332" y="178" width="26" height="42" rx="6" fill="#0F3D26"/>
  <rect x="336" y="184" width="18" height="26" rx="2" fill="#DFF5E7"/>

  <!-- checklist flutuante -->
  <g transform="translate(120 150)">
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="2"/>
    <path d="M-6 0 L-2 4 L6 -5" fill="none" stroke="#1FA64A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(360 150)">
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="2"/>
    <path d="M-6 0 L-2 4 L6 -5" fill="none" stroke="#1FA64A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- badge grafico de barras -->
  <g transform="translate(60 70)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="2"/>
    <rect x="-12" y="-2" width="6" height="14" rx="1.5" fill="#1FA64A"/>
    <rect x="-3" y="-8" width="6" height="20" rx="1.5" fill="#1FA64A"/>
    <rect x="6" y="-12" width="6" height="24" rx="1.5" fill="#0F3D26"/>
  </g>

  <!-- badge cifrao -->
  <g transform="translate(240 46)">
    <circle cx="0" cy="0" r="24" fill="#1FA64A"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>

  <!-- badge grafico de pizza -->
  <g transform="translate(420 90)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="2"/>
    <path d="M0 0 L0 -16 A16 16 0 0 1 14 8 Z" fill="#1FA64A"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#0F3D26" stroke-width="2"/>
  </g>
</svg>
